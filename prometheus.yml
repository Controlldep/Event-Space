global:
  scrape_interval: 5s

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: 'events-service'
    static_configs:
        - targets: [ 'events:3000' ]

  - job_name: 'payments-service'
    static_configs:
      - targets: [ 'payments:3002' ]

  - job_name: 'auth-service'
    static_configs:
        - targets: [ 'auth:3001' ]

  - job_name: 'node-exporter'
    static_configs:
        - targets: [ 'node-exporter:9100' ]

  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]