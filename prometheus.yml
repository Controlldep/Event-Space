global:
  scrape_interval: 5s

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: 'nestjs-app'
    static_configs:
      - targets: [ 'backend:3000' ]

  - job_name: 'node-exporter'
    static_configs:
        - targets: [ 'node-exporter:9100' ]

  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]