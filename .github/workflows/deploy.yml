name: Simple Check

on:
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Deps
        run: yarn install --frozen-lockfile

      - name: Run Unit Tests
        env:
          NODE_ENV: test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_db
          JWT_SECRET: "123"
          JWT_SECRET_REFRESH: "12345"
          MAX_AGE_ACCESS_TOKEN: "10m"
          MAX_AGE_REFRESH_TOKEN: "20m"
          MY_EMAIL: "test@test.com"
          MY_PASS: "test_pass"
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: yarn jest --testPathIgnorePatterns=test

      - name: Run E2E Tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_db
          JWT_SECRET: "123"
          JWT_SECRET_REFRESH: "12345"
          MAX_AGE_ACCESS_TOKEN: "10m"
          MAX_AGE_REFRESH_TOKEN: "20m"
          MY_EMAIL: "test@test.com"
          MY_PASS: "test_pass"
        run: yarn jest test --runInBand --forceExit

      - name: Build Project
        run: yarn build