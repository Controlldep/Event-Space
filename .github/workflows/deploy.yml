name: Simple Check

on:
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: elasticsearch/elasticsearch:8.12.0
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          xpack.security.enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q 'status.*\(green\|yellow\)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Deps
        run: yarn install --frozen-lockfile

      - name: Run Unit Tests
        env:
          NODE_ENV: test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_db
          JWT_SECRET: "123"
          JWT_SECRET_REFRESH: "12345"
          MAX_AGE_ACCESS_TOKEN: "10m"
          MAX_AGE_REFRESH_TOKEN: "20m"
          MY_EMAIL: "test@test.com"
          MY_PASS: "test_pass"
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: yarn jest --testPathIgnorePatterns=test

      - name: Run E2E Tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_db
          JWT_SECRET: "123"
          JWT_SECRET_REFRESH: "12345"
          MAX_AGE_ACCESS_TOKEN: "10m"
          MAX_AGE_REFRESH_TOKEN: "20m"
          MY_EMAIL: "test@test.com"
          MY_PASS: "test_pass"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          MAX_AGE_ACCESS_TOKEN_FOR_REDIS: 600
          MAX_AGE_REFRESH_TOKEN_FOR_REDIS: 1200
        run: yarn jest test --runInBand --forceExit

      - name: Build Project
        run: yarn build

      - name: Build Docker Image
        run: docker build -t event-space-check .

      - name: Verify Docker Container Startup
        run: |
          docker run -d --name api-check \
            --network host \
            -e NODE_ENV=test \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USERNAME=test_user \
            -e DB_PASSWORD=test_password \
            -e DB_DATABASE=test_db \
            -e JWT_SECRET=123 \
            event-space-check
          
          sleep 10
          
          if [ $(docker inspect -f '{{.State.Running}}' api-check) != "true" ]; then
            echo "Container failed to start. Printing logs"
            docker logs api-check
            exit 1
          fi
          echo "Container is running"